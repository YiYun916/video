<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鲸鱼影视</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --line:#eceef2; --line2:#e6e9f0;
  --txt:#17181c; --sub:#8a8f99; --sub2:#b6bac4; --soft:#f2f3f7;
  --acc:#0f7bf0; --acc-d:#0a67cf; --pink:#ff5a7a; --ok:#21a067;
  --shadow:0 3px 14px rgba(20,60,130,.07);
}
body.dark{
  --bg:#101319; --card:#181c24; --line:#232936; --line2:#2a3242;
  --txt:#e8ecf4; --sub:#8b94a6; --sub2:#5f6879; --soft:#20262f;
  --shadow:0 3px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","HarmonyOS Sans","Microsoft YaHei",system-ui,sans-serif;line-height:1.5;overflow-x:hidden;transition:background .2s}
a{color:inherit;text-decoration:none}img{display:block}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* 顶部 */
.top{position:sticky;top:0;z-index:50;background:var(--card);box-shadow:0 1px 0 var(--line);padding:10px 14px}
.top-row{position:relative;display:flex;align-items:center;justify-content:space-between}
.menubtn{width:36px;height:36px;border-radius:50%;background:var(--soft);border:1px solid var(--line2);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.menubtn .ic-svg{width:20px;height:20px}
.top-row .logo{position:absolute;left:50%;transform:translateX(-50%)}
.logo{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:800;white-space:nowrap}
.logo .ic{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#0f7bf0,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.searchBox{flex:1;display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:22px;padding:3px 6px 3px 14px}
.searchBox input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px;padding:7px 0}
.searchBox input::placeholder{color:var(--sub2)}
.searchBox button{background:var(--acc);color:#fff;border-radius:18px;padding:7px 14px;font-size:13px;font-weight:600}
.searchBox button:active{background:var(--acc-d)}
.themeBtn{width:32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:16px}

/* 分类 */
.cats{display:flex;gap:2px;padding:8px 8px 0;background:var(--card);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.cats::-webkit-scrollbar{display:none}
.cat{position:relative;padding:8px 14px;font-size:15px;color:var(--sub);white-space:nowrap;font-weight:500}
.cat.on{color:var(--acc);font-weight:700}
.cat.on::after{content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:18px;height:3px;border-radius:2px;background:var(--acc)}

/* 数据源 */
/* 数据源切换已移至「我的」页 */
.sources::-webkit-scrollbar{display:none}
.sources .label{font-size:11px;color:var(--sub2);white-space:nowrap;margin-right:2px}
.src{padding:5px 11px;border-radius:7px;background:var(--soft);border:1px solid var(--line2);font-size:12px;color:var(--sub);white-space:nowrap}
.src.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.src.off{opacity:.45}
.src .h{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:4px}

/* 网格 */
.wrap{max-width:720px;margin:0 auto;padding:5px 8px 80px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr);gap:12px}}
.card{position:relative;border-radius:11px;overflow:hidden;background:var(--card);cursor:pointer;box-shadow:var(--shadow)}
.card:active{opacity:.85}
.card .ph{position:relative;aspect-ratio:2/3;background:var(--soft);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph .rk{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:5px;font-size:10px;color:#ffd75e;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ph .tag{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:5px;font-size:9px;color:#fff}
.card .ph .multi{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:5px;font-size:9px;color:#4fb3ff}
.txtcover{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff}
.txtcover .big{font-size:34px;font-weight:800;line-height:1}
.txtcover small{font-size:11px;opacity:.92;padding:0 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card .tt{padding:6px 8px 8px}
.card .tt .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tt .sub{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loadmore{display:block;margin:20px auto 0;padding:11px 0;width:60%;background:var(--card);border:1px solid var(--line2);color:var(--acc);border-radius:22px;font-size:14px;text-align:center}
.loadmore:active{background:var(--soft)}
.msg,#msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;font-size:14px;color:var(--sub);text-align:center}
.spinner{width:32px;height:32px;margin:0 auto 12px;border:3px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 详情 */
.overlay{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#detailOv{z-index:95}
.overlay.open{display:block}
.d-banner{background:linear-gradient(160deg,#0b4d9e,#0f6fd0 60%,transparent);color:#fff;padding:14px 16px 22px}
body.dark .d-banner{background:linear-gradient(160deg,#0b4d9e,#0f6fd0 55%,#101319)}
.d-back{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.d-head{display:flex;gap:13px;margin-top:12px}
.d-poster{width:104px;flex-shrink:0;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.d-poster img{width:100%;display:block}
.d-info{flex:1;min-width:0}
.d-title{font-size:19px;font-weight:800;line-height:1.3;margin:2px 0 8px}
.d-tags{display:flex;flex-wrap:wrap;gap:5px}
.d-tags span{font-size:11px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:2px 8px;border-radius:5px}
.playerBox{margin-top:14px;background:#000;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.playerBox video{width:100%;display:block;max-height:52vh;background:#000}
.pnow{display:flex;align-items:center;gap:10px;margin-top:8px;padding:0 2px;font-size:13px;color:var(--acc);font-weight:600}
.pnow .t{flex:1;color:var(--sub);font-weight:400;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.pbtn{padding:6px 12px;border-radius:8px;background:var(--soft);border:1px solid var(--line2);font-size:12px;color:var(--sub)}
.pbtn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pbtn.on-d{background:var(--ok);color:#fff;border-color:var(--ok)}
.vol{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--sub)}
.vol input{flex:1;accent-color:var(--acc)}
.d-body{padding:6px 16px 90px}
.d-meta{font-size:12px;color:var(--sub);margin:4px 0}
.d-desc{font-size:13px;color:var(--txt);line-height:1.7;background:var(--soft);border-radius:10px;padding:10px 12px;margin:8px 0}
.d-desc .more{color:var(--acc);font-weight:600}
.d-sec{font-size:15px;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.d-sec::before{content:"";width:4px;height:15px;background:var(--acc);border-radius:2px}
.ply-from{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ply-from button{padding:7px 13px;border-radius:9px;background:var(--soft);border:1px solid var(--line2);font-size:12px;color:var(--sub)}
.ply-from button.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.epiBtn{width:100%;padding:12px;border-radius:11px;background:var(--card);border:1px solid var(--line2);color:var(--txt);font-size:14px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
.epiBtn .a{color:var(--acc);font-size:15px}

/* 选集底部弹窗 */
.sheetOv{position:fixed;inset:0;z-index:120;display:none}
.sheetOv.open{display:block}
.sheetMask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:6px 16px 16px;transform:translateY(100%);transition:transform .28s ease;max-height:72vh;overflow-y:auto}
.sheetOv.open .sheet{transform:translateY(0)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}
.sheet-head .t{font-size:16px;font-weight:700}
.sheet-head .x{color:var(--sub);font-size:15px;padding:4px}
.sheet .srcrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sheet .srcrow button{padding:6px 12px;border-radius:8px;background:var(--soft);border:1px solid var(--line2);font-size:12px;color:var(--sub)}
.sheet .srcrow button.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.sheet-eps{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.sheet-eps button{padding:11px 0;border-radius:9px;background:var(--soft);border:1px solid var(--line2);font-size:13px;color:var(--txt);text-align:center}
.sheet-eps button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

/* 我的 */
.mine{padding:46px 16px 90px}
.mine-title{font-size:24px;font-weight:800;margin-bottom:20px}
.mine .mtop{display:flex;align-items:center;gap:10px;padding:6px 0 16px}
.mine .mtop .ic{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#0f7bf0,#22d3ee);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.mine .mtop .nm{font-size:17px;font-weight:800}
.mine .mtop .s{font-size:12px;color:var(--sub)}
.mine h2{font-size:15px;margin:6px 0 10px;color:var(--sub);font-weight:600}
.set-group{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;margin-bottom:12px}
.src-item{display:flex;align-items:center;gap:8px;padding:9px 10px;background:var(--soft);border:1px solid var(--line2);border-radius:9px;margin-bottom:6px;font-size:13px}
.src-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.src-item code{font-size:10px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38%}
.src-item .st{font-size:10px;padding:2px 6px;border-radius:5px;white-space:nowrap}
.src-item .st.ok{color:var(--ok);background:rgba(33,160,103,.12)}
.src-item .st.bad{color:var(--pink);background:rgba(255,90,122,.12)}
.src-item .st.off{color:var(--sub2);background:var(--soft)}
.src-item .tbtn{color:var(--acc);font-size:12px;padding:0 4px}
.src-item .del{color:var(--pink);font-size:16px;padding:0 4px}
/* 设置页现代化 */
.set-line{display:flex;align-items:center;gap:10px;padding:12px 2px}
.set-line+.set-line{border-top:1px solid var(--line)}
.set-ic{width:26px;height:26px;border-radius:8px;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.set-ic svg{width:18px;height:18px}
.set-txt{flex:1;font-size:14px}
.set-r{color:var(--sub2);font-size:13px;display:flex;align-items:center;gap:6px}
.mini{font-size:12px;padding:4px 12px;border-radius:7px;background:var(--soft);border:1px solid var(--line2);color:var(--acc)}
.sw{position:relative;width:46px;height:27px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw .sl{position:absolute;inset:0;background:var(--soft);border-radius:20px;transition:.25s;border:1px solid var(--line2)}
.sw .sl:before{content:"";position:absolute;width:21px;height:21px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+.sl{background:var(--acc);border-color:var(--acc)}
.sw input:checked+.sl:before{transform:translateX(19px)}
.set-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.set-row input{flex:1;background:var(--soft);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:13px;outline:none}
.set-row button{padding:10px 14px;border-radius:9px;background:var(--acc);color:#fff;font-size:13px;white-space:nowrap}
.hint{font-size:11px;color:var(--sub);line-height:1.7;margin-top:8px}
.abt{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;font-size:12px;color:var(--sub);line-height:1.8}
.hist-row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--soft);margin-bottom:6px;cursor:pointer}
.hist-row img{width:44px;height:60px;object-fit:cover;border-radius:6px}
.hist-row .i{flex:1;min-width:0}
.hist-row .i .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-row .i .d{font-size:11px;color:var(--sub);margin-top:2px}
.hist-row .go{color:var(--acc)}

/* 底部 */
.bottomTab{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bottomTab .bt{flex:1;padding:8px 0 9px;text-align:center;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px}
.bottomTab .bt .i{font-size:20px;line-height:1}
.bottomTab .bt.on{color:var(--acc);font-weight:600}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1}
/* 独立播放页 */
.playPage{min-height:100%;background:#000;color:#fff;padding-bottom:46px}
.p-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#000;position:sticky;top:0;z-index:5}
.p-top .d-back{background:rgba(255,255,255,.14);color:#fff}
.p-title{flex:1;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-playerBox{width:100%;background:#000}
.p-playerBox video{width:100%;display:block;max-height:46vh;background:#000}
.playPage .pnow{margin-top:10px;padding:0 14px;color:#cfd3dc}
.playPage .playbar{padding:0 14px;margin-top:10px}
.p-sec{font-size:14px;font-weight:700;margin:16px 14px 9px;color:#fff;display:flex;align-items:center;gap:6px}
.p-sec::before{content:"";width:4px;height:14px;background:var(--acc);border-radius:2px}
.playPage .ply-from{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px}
.playPage .ply-from button{padding:7px 12px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:12px;color:#d5d9e1}
.playPage .ply-from button.on{color:#fff;background:var(--acc);border-color:var(--acc)}
.p-eps{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:0 14px}
.p-eps button{padding:11px 0;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:13px;color:#fff;text-align:center}
.p-eps button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.p-desc{font-size:12px;color:#9aa0ab;padding:0 14px;line-height:1.7;margin-top:14px}
/* 播放按钮(详情页) */
.playBtn{margin:0 16px 14px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#0f7bf0,#22d3ee);color:#fff;font-size:16px;font-weight:700;text-align:center;box-shadow:var(--shadow)}
/* 我的页个人中心 */
.mine-profile{display:flex;align-items:center;gap:14px;padding:18px 16px;background:var(--card);border:1px solid var(--line2);border-radius:16px;position:relative}
.mine-profile .avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#0f7bf0,#22d3ee);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;flex-shrink:0}
.mine-profile .nm{font-size:18px;font-weight:800}
.mine-profile .s{font-size:12px;color:var(--sub);margin-top:3px}
.mine-profile .setTop{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:16px}
/* 左侧边栏 */
.sidebar{position:fixed;top:0;left:0;height:100%;width:100%;z-index:200;display:none}
.sidebar.open{display:block}
.side-mask{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.side-body{position:absolute;top:0;left:0;height:100%;width:78%;max-width:320px;background:var(--card);box-shadow:2px 0 18px rgba(0,0,0,.25);padding:14px 16px 60px;overflow-y:auto;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column}
.sidebar.open .side-body{transform:translateX(0)}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.side-logo{font-size:18px;font-weight:800;color:var(--txt)}
.side-x{width:32px;height:32px;border-radius:50%;background:var(--soft);border:none;color:var(--sub);font-size:16px;cursor:pointer}
.side-sec{font-size:13px;font-weight:700;color:var(--sub);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.side-sec::before{content:"";width:4px;height:13px;background:var(--acc);border-radius:2px}
.side-item{display:flex;align-items:center;gap:10px;padding:11px 6px;font-size:14px;color:var(--txt);border-radius:10px;cursor:pointer}
.side-item:active{background:var(--soft)}
.side-item .em{font-size:17px;width:22px;text-align:center}
.side-item .arr{margin-left:auto;color:var(--sub2)}
.side-nav{margin-bottom:2px}
.side-item .em .ic-svg,.side-item .em svg{width:19px;height:19px}
.side-flex{flex:1;min-height:16px}
.side-x .ic-svg{width:16px;height:16px}
.side-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.side-cat{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--soft);border:1px solid var(--line2);color:var(--sub);cursor:pointer}
.side-cat.on{background:var(--acc);border-color:var(--acc);color:#fff}
.side-rank-sec{font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px}
.side-rank-tip{font-size:11px;color:var(--acc);margin-top:8px}
.side-rank-row{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer}
.side-rank-row .rank-no{width:18px;font-size:14px}
.side-rank-row .rank-ph{width:42px}
.side-rank-row .rank-name{font-size:13px}
/* 首页轮播 */
.carousel{position:relative;margin:12px 12px 16px;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:var(--soft)}
.c-track{display:flex;height:100%;transition:transform .5s ease}
.c-slide{position:relative;flex:0 0 100%;height:100%;cursor:pointer}
.c-slide img{width:100%;height:100%;object-fit:cover}
.c-slide .bn-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.75))}
.c-slide .bn-info{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.c-slide .bn-name{font-size:18px;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.c-slide .bn-badge{font-size:11px;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:10px;margin-bottom:6px;display:inline-block}

/* ================= 请求(原生桥优先+硬超时+健康度) ================= */
function parseBody(body){
  if(typeof body!=="string") return JSON.parse(body);
  if(body.indexOf("base64:")===0){ try{ body=atob(body.slice(7)); }catch(e){} }
  return JSON.parse(body);
}
function webcatRequest(url){
  return new Promise(function(resolve,reject){
    var settled=false;
    function done(ok,v){ if(settled) return; settled=true; ok?resolve(v):reject(v); }
    var timer=setTimeout(function(){ done(false,new Error("请求超时")); },10000);
    try{
      if(window.webcat && webcat.network && webcat.network.request){
        var p;
        try{ p=webcat.network.request({method:"GET",url:url}); }
        catch(e){ clearTimeout(timer); done(false,e); return; }
        if(p && typeof p.then==="function"){
          p.then(function(r){ clearTimeout(timer); done(true,r); },
                 function(e){ clearTimeout(timer); done(false,e); });
        } else { clearTimeout(timer); done(false,new Error("webcat返回异常")); }
      } else { clearTimeout(timer); done(false,new Error("no webcat")); }
    }catch(e){ clearTimeout(timer); done(false,e); }
  });
}
function healthOk(i){ if(!state.sources[i])return; state.sources[i].health.fail=0; saveSources(); }
function healthFail(i){ if(!state.sources[i])return; var h=state.sources[i].health; h.fail++; if(h.fail>=3){ h.disabled=true; } saveSources(); }

function yunApi(url, params){

function getJson(params, srcIdx){
  if(srcIdx===undefined) srcIdx=state.curSrc;
  var api=state.sources[srcIdx].api;
  return webcatRequest(api+"?"+params).then(function(r){
    var d=parseBody(r.body); healthOk(srcIdx); return d;
  }).catch(function(){
    healthFail(srcIdx);
    var ctrl=new AbortController(); var timer=setTimeout(function(){ctrl.abort();},10000);
    return fetch(api+"?"+params,{headers:{"User-Agent":"Mozilla/5.0"},signal:ctrl.signal})
      .then(function(r){clearTimeout(timer);return r.json();})
      .catch(function(e){clearTimeout(timer);throw new Error("失败");});
  });
}

var PAGE_COVER=18, PAGE_TEXT=30, CAT_N=3;
function measure(url){
  return new Promise(function(res){

  });
}
var HOME_CACHE_MS=10*60*1000;

function doLoad(reset){
  var src=state.curSrc;
  var api="ac=videolist";
  var reqs;
  if(state.cat==="追剧"){ state.busy=false; renderFollow(); return; }
  if(state.keyword){
    reqs=[getJson(api+"&wd="+encodeURIComponent(state.keyword)+"&pg="+state.page+"&pagesize="+PAGE_COVER,src)];
  }else{
    if(state.cat!=="推荐"&&state.cat!=="全部"){ var _cs=catTs(); if(!_cs||!_cs.length){ state.busy=false; setLoading(); showMsg('<div class="msg">当前源暂无「'+state.cat+'」分类，试试切换到其他数据源</div>'); return; } }
    var tids=recTids(state.cat);
    if(tids&&tids.length){ reqs=tids.map(function(t){var rpg=1+Math.floor(Math.random()*3);return getJson(api+"&t="+t+"&pg="+rpg+"&pagesize=15",src);}); }
    else { reqs=[getJson(api+"&pg=1&pagesize="+PAGE_COVER,src)]; }
  }
  Promise.all(reqs.map(function(p){ return p.catch(function(){ return {list:[]}; }); })).then(function(resArr){
    state.busy=false;
    var list=[]; var anyFull=false;
    resArr.forEach(function(d){ var l=(d&&d.list)||[]; list=list.concat(l); if(l.length>=10) anyFull=true; });
    document.getElementById("msg").style.display="none";
    document.getElementById("msg").innerHTML="";
    var grid=document.getElementById("grid");
    if(state.keyword){
      grid.style.display="";
      grid.innerHTML= reset? list.map(vodToCard).join("") : grid.innerHTML+list.map(vodToCard).join("");
      if(!list.length) showMsg('<div class="msg">没搜到结果，换个词或换数据源试试</div>');
      document.getElementById("loadMore").style.display= anyFull?"block":"none";
    }else{
      renderRecommend(list);
      document.getElementById("loadMore").style.display="none";
    }
    state._force=false;
  });
}
function recTids(cat){
  var base= (cat==="推荐"||cat==="全部")? allCatTs() : (catTs()||[]);
  var arr=base.slice(0); var seed=(state.recSeed==null||state.recSeed===undefined)?Math.floor(Math.random()*50):(state.recSeed||0);
  if(arr.length){ var k=seed%arr.length; arr=arr.slice(k).concat(arr.slice(0,k)); }
  return arr.slice(0, (cat==="推荐"||cat==="全部")?4:CAT_N);
}
function allCatTs(){ var s=state.sources[state.curSrc]; var m=(s&&s.cats)||{}; var out=[]; for(var k in m){ if(m[k]&&m[k].length) out=out.concat(m[k]); } return out.filter(function(v,i,a){return a.indexOf(v)===i;}); }
function renderRecommend(list){
  var seen={}; var out=[];
  list.forEach(function(v){ var n=normName(v.vod_name||""); if(!n||seen[n])return; seen[n]=1; out.push(v); });
  var grid=document.getElementById("grid");
  grid.style.display="block";
  if(!out.length){ showMsg('<div class="msg">推荐流没拉到资源，换个数据源或点「换一批」试试</div>'); return; }
  var slides=out.slice(0,4);
  var rest=out.slice(4);
  var cards=rest.map(function(v){
    var meta=[];
    if(v.type_name)meta.push(v.type_name); if(v.vod_year)meta.push(v.vod_year);
    if(v.vod_remarks)meta.push('<span class="r">'+v.vod_remarks+'</span>');
    return '<div class="card-big" onclick="openDetail('+v.vod_id+')">'+
      '<div class="cb-pic">'+coverHtml(v)+'</div>'+
      '<div class="cb-info"><div class="cb-name">'+(v.vod_name||"")+'</div>'+
      '<div class="cb-meta">'+meta.join(" · ")+'</div>'+
      (v.vod_blurb?'<div class="cb-desc">'+esc(cleanDesc(v.vod_blurb))+'</div>':'')+
      '</div></div>';
  }).join("");
  var head;
  if(slides.length>1){
    head='<div class="carousel">'+
      '<div class="c-track" id="cTrack">'+slides.map(function(s,i){
        return '<div class="c-slide" onclick="openDetail('+s.vod_id+')">'+coverHtml(s)+
          '<div class="bn-grad"></div><div class="bn-info"><span class="bn-badge">'+(i===0?"热门推荐":(s.type_name||""))+'</span>'+
          '<div class="bn-name">'+(s.vod_name||"")+'</div>'+
          '<div class="bn-meta">'+(s.type_name||"")+(s.vod_remarks?" · "+s.vod_remarks:"")+'</div></div></div>';
      }).join('')+'</div>'+
      '<div class="c-dots" id="cDots">'+slides.map(function(s,i){return '<span class="c-dot'+(i===0?" on":"")+'" onclick="carouselGo('+i+')"></span>';}).join('')+'</div>'+
      '</div>';
  }else{
    var b=slides[0];
    head='<div class="banner" onclick="openDetail('+b.vod_id+')">'+coverHtml(b)+
      '<div class="bn-grad"></div><div class="bn-info"><span class="bn-badge">热门推荐</span>'+
      '<div class="bn-name">'+(b.vod_name||"")+'</div>'+
      '<div class="bn-meta">'+(b.type_name||"")+(b.vod_remarks?" · "+b.vod_remarks:"")+'</div></div></div>';
  }
  grid.innerHTML=head+(cards||'')+
    '<div class="rec-more"><button onclick="recShuffle()">'+IC.refresh+' 换一批</button></div>';
  if(slides.length>1) carouselStart(slides.length);
  window.scrollTo(0,0);
}
function recShuffle(){ state._force=true; state.recSeed=(state.recSeed||0)+1; state.page=1; load(true); }
function load(reset){
  if(state.busy) return;
  state.busy=true;
  if(reset){ state.page=1; setLoading(); }
  // 追剧是本地收藏分类，不走网络测速直接渲染
  if(state.cat==="追剧"){ doLoad(reset); return; }
  // 翻页沿用已有模式，不重复测速
  if(!reset && state.listMode!==undefined){ doLoad(reset); return; }
  // 测速自适应：快网→真封面(videolist)；慢网→极简小体积(ac=list)防拉不到
  measure(state.sources[state.curSrc].api+"?ac=list&pg=1&pagesize=1").then(function(ms){
    state.listMode= ms<3000?"cover":"text";
    localStorage.setItem("jy_lm",state.listMode);
    doLoad(reset);
  }).catch(function(){ state.listMode="text"; doLoad(reset); });
}

function doSearch(){

  });

function aggToCard(v){

function openAgg(p){
  // 优先用聚合时已缓存的 hits(含 src+vod),直接进详情,避免重新搜索匹配失败
  var hit=(p&&p.hits||[]).filter(function(h){return h&&h.src!==undefined&&h.vod;});
  if(hit.length){ openAggDetail(hit); return; }
  // 兜底：旧缓存卡无 hits 时按 key 重新搜索
  var kw=state.keyword;
  var active=state.sources.map(function(s,i){return i;}).filter(function(i){return state.sources[i].enabled!==false&&!state.sources[i].health.disabled;});
  var reqs=active.map(function(i){ return getJson("ac=detail&wd="+encodeURIComponent(kw)+"&pagesize=12",i).then(function(d){return {src:i,list:(d&&d.list)||[]};}).catch(function(){return {src:i,list:[]};}); });
  Promise.all(reqs).then(function(res){
    var hit=[];
    res.forEach(function(r){ r.list.forEach(function(v){ if(normName(v.vod_name)+":"+(v.vod_year||"")===p.key){ hit.push({src:r.src, vod:v}); } }); });
    if(!hit.length){ toast("未找到该片详情"); return; }
    openAggDetail(hit);
  });
}
function openAggDetail(hit){
  openOv("detailOv");
  document.getElementById("detailBody").innerHTML='<div style="padding:90px 0;text-align:center"><div class="spinner"></div><div>加载中…</div></div>';
  Promise.all(hit.map(function(h){ return getJson("ac=detail&ids="+h.vod.vod_id, h.src).then(function(d){ return d; }).catch(function(){ return null; }); })).then(function(details){
    var base=(details[0]&&details[0].list&&details[0].list[0])||hit[0].vod;
    var allFrom=[], allUrl=[];
    details.forEach(function(d){
      if(d&&d.list&&d.list[0]){
        var v=d.list[0];
        var f=(v.vod_play_from||"").split("$$$").map(function(x){return x.trim();}).filter(Boolean);
        var u=(v.vod_play_url||"").split("$$$");
        f.forEach(function(x,i){ allFrom.push(x); allUrl.push(u[i]||""); });
      }
    });
    state.vod=Object.assign({}, base, {vod_play_from:allFrom.join("$$$"), vod_play_url:allUrl.join("$$$")});
    state.playFromIdx=0; state.playEpiIdx=0;
    renderDetail();
  });
}

function parsePlay(v){
  var froms=(v.vod_play_from||"").split("$$$").map(function(x){return x.trim();}).filter(Boolean);

  var groups=[];

    if(eps.length && /\.m3u8/i.test(eps[0].u)){ groups.push({from:f,eps:eps}); }
  });
  return groups;
}

/* ================= 播放器(详情页内嵌) ================= */
function buildPlayer(){
  var groups=parsePlay(state.vod);
  var cur=groups[state.playFromIdx];
  if(!cur||!cur.eps[state.playEpiIdx]) return;
  var u=cur.eps[state.playEpiIdx].u;
  var box=document.getElementById("playerBox");
  if(!box) return;
  var v=document.createElement("video"); v.id="jvplayer"; v.controls=true; v.autoplay=true; v.playsinline=true;
  box.innerHTML=""; box.appendChild(v);
  setupHls(v,u);
  // 控制条：倍速 + 自动连播 + 广告过滤 + 下载
  var bar=document.getElementById("playbar");
  var rates=[1,1.25,1.5,2];
  var rBtns=rates.map(function(r){ return '<button class="pbtn'+(state.rate===r?" on":"")+'" data-rate="'+r+'" onclick="setRate('+r+')">'+r+'x</button>'; }).join("");
  bar.innerHTML=
    '<span class="lb">功能：</span>'+
    '<button class="pbtn'+(state.autoNext?" on-d":"")+'" onclick="toggleAutoNext()">连播</button>'+
    '<button class="pbtn'+(state.adFilter?" on":"")+'" onclick="toggleAdFilter()">过滤广告</button>'+
    '<button class="pbtn" onclick="togglePiP()">小窗</button>'+
    '<span class="nl"></span>'+
    '<span class="lb">倍速：</span>'+rBtns;
  // 手势: 左/右半屏快退快进 · 中暂停/播放 · 横向滑动调进度 · 长按3倍速
  var lt=null,sx=0,sy=0,sliding=false,moving=false;
  v.addEventListener("touchstart",function(e){ var t=e.touches[0]; sx=t.clientX; sy=t.clientY; sliding=false; moving=false; lt=setTimeout(function(){ v.playbackRate=3; },550); },{passive:true});
  v.addEventListener("touchmove",function(e){ var t=e.touches[0]; var dx=t.clientX-sx,dy=t.clientY-sy; if(!sliding&&(Math.abs(dx)>24||Math.abs(dy)>24)) sliding=true; if(sliding){ clearTimeout(lt); lt=null; if(Math.abs(dx)>Math.abs(dy)) moving=true; } },{passive:true});
  v.addEventListener("touchend",function(e){
    clearTimeout(lt); lt=null; v.playbackRate=state.rate;
    if(sliding&&moving){ var dx=e.changedTouches[0].clientX-sx; var w=v.clientWidth||window.innerWidth; var step=Math.round(dx/w*120); if(step){ v.currentTime=Math.max(0,Math.min(v.duration||(v.currentTime+step), v.currentTime+step)); toast((step>0?"快进":"快退")+Math.abs(step)+"s"); } return; }
    if(!sliding){ var w=v.clientWidth||window.innerWidth; var rx=e.changedTouches[0].clientX;
      if(rx<w*0.33){ v.currentTime=Math.max(0,(v.currentTime||0)-10); toast("快退10s"); }
      else if(rx>w*0.67){ v.currentTime=(v.currentTime||0)+10; toast("快进10s"); }
      else { if(v.paused) v.play(); else v.pause(); } }
  },{passive:true});
  v.addEventListener("touchcancel",function(){ clearTimeout(lt); lt=null; v.playbackRate=state.rate; });
  // 自动连播
  v.addEventListener("ended",function(){ if(state.autoNext) playNext(); });
  // 播放失败 → 自动切换下一个源/下一集
  v.addEventListener("error",function(){ autoSwitchSource(); });
  // 进度保存 + 续播
  var lastSave=0;
  v.addEventListener("timeupdate",function(){
    var now=Date.now();
    if(now-lastSave>4000){ saveProgress(v.currentTime); lastSave=now; }
  });
  v.addEventListener("loadedmetadata",function(){
    var p=getProgress();
    if(p>8){ v.currentTime=p; toast("已续播到 "+fmt(p)); }
  });
  updatePnow();
}
function fmt(s){ var m=Math.floor(s/60); s=Math.floor(s%60); return m+":"+(s<10?"0":"")+s; }
function setRate(r){ state.rate=r; var v=document.querySelector("#playerBox video"); if(v) v.playbackRate=r; syncRateUI(); toast(r+"倍速"); }
function syncRateUI(){ var bar=document.getElementById("playbar"); if(!bar) return; var bs=bar.querySelectorAll("[data-rate]"); for(var i=0;i<bs.length;i++){ bs[i].classList.toggle("on", parseFloat(bs[i].getAttribute("data-rate"))===state.rate); } }
function toggleAutoNext(){ state.autoNext=!state.autoNext; localStorage.setItem("jy_auto",state.autoNext?"1":"0"); toast(state.autoNext?"已开启自动连播":"已关闭连播"); }
function toggleAdFilter(){ state.adFilter=!state.adFilter; localStorage.setItem("jy_adf",state.adFilter?"1":"0"); toast(state.adFilter?"已开启广告过滤":"已关闭广告过滤"); }
function autoSwitchSource(){
  if(state._switching) return; state._switching=true;
  try{
    var groups=parsePlay(state.vod);
    if(!groups||!groups.length){ state._switching=false; return; }
    var cur=groups[state.playFromIdx];
    if(state.playFromIdx < groups.length-1){
      state.playFromIdx++;
      var next=groups[state.playFromIdx];
      var idx=-1;
      for(var i=0;i<next.eps.length;i++){ if(cur&&next.eps[i].n===cur.eps[state.playEpiIdx].n){idx=i;break;} }
      state.playEpiIdx= idx>=0? idx : Math.min(state.playEpiIdx||0, next.eps.length-1);
      toast("当前源失效，已切换到 "+groups[state.playFromIdx].from);
      renderDetail();
    }else if(cur && state.playEpiIdx < cur.eps.length-1){
      toast("该源失效，尝试下一集");
      state.playEpiIdx++;
      renderDetail();
    }else{
      toast("所有播放源均失败，换个源或稍后再试");

  }catch(e){}

/* 广告分片过滤 */
function filterM3u8(url, cb){
  fetch(url).then(function(r){ return r.text(); }).then(function(text){
    try{
      var lines=text.split(/\r?\n/); var out=[];
      for(var i=0;i<lines.length;i++){
        var l=lines[i];
        if(l && l[0]!=="#" && /(^|\/)(ad|adv|gg|advert|promo|guanggao)/i.test(l)) continue;
        // 相对路径转绝对
        if(l && l[0]!=="#" && l[0]!="/" && !/^https?:/i.test(l)) l=new URL(l,url).href;
        out.push(l);
      }
      var clean=out.join("\n");
      var blob=new Blob([clean],{type:"application/vnd.apple.mpegurl"});
      cb(URL.createObjectURL(blob));
    }catch(e){ cb(url); }
  }).catch(function(){ cb(url); });
}
function makeNoRefLoader(){
  function NoRefLoader(config){ this.config=config||{}; }
  NoRefLoader.prototype.load=function(context,config,callbacks){
    var now=Date.now();
    var stats={trequest:now,tfirst:-1,tload:-1,loaded:0,buffered:0,loading:{start:now,first:-1,end:-1},parsing:{start:-1,end:-1},buffering:{start:-1,end:-1},transmuxing:{start:-1,end:-1},parsed:false,retry:0};
    try{ this.stats=stats; }catch(e){}
    var aborted=false;
    var ac=new AbortController();
    this._abort=function(){ aborted=true; try{ac.abort();}catch(e){} };
    var url=context.url, type=(context&&context.type)||"";
    var isTxt=type==="manifest"||type==="level"||type==="audioTrack"||type==="subtitleTrack"||type==="track";
    fetch(url,{referrerPolicy:"no-referrer",mode:"cors",signal:ac.signal})
      .then(function(r){
        if(aborted)return;
        stats.tfirst=Date.now(); stats.loading.first=stats.tfirst;
        if(!r.ok){ callbacks.onError({type:"network",details:(r.status===404?"loadError":"httpError"),fatal:false,isTimeout:false,networkDetails:r},context,{},stats); return; }
        return isTxt? r.text() : r.arrayBuffer();
      }).then(function(d){
        if(aborted||d===undefined||d===null)return;
        stats.tload=Date.now(); stats.loading.end=stats.tload; stats.loaded=1;
        callbacks.onSuccess({url:url,data:d},stats,context,{});
      }).catch(function(e){
        if(aborted)return;
        callbacks.onError({type:"network",details:"networkError",fatal:false,isTimeout:false,networkDetails:e},context,{},stats);
      });
  };
  NoRefLoader.prototype.abort=function(){ if(this._abort)this._abort(); };
  NoRefLoader.prototype.destroy=function(){ this.abort(); };
  return NoRefLoader;
}
function setupHls(video,url){
  var isM3u8=url.indexOf(".m3u8")>=0;
  var src=url;
  var is360=/maowushi\.com/i.test(src);
  function start(s, useNoRef){
    if(isM3u8 && window.Hls && Hls.isSupported()){
      var cfg={liveSyncDurationCount:3};
      if(useNoRef) cfg.loader=makeNoRefLoader();
      var h=new Hls(cfg);
      h.loadSource(s); h.attachMedia(video);
      var tried=false;
      h.on(Hls.Events.MANIFEST_PARSED,function(){ video.play().catch(function(){}); });
      h.on(Hls.Events.ERROR,function(e,data){
        if(data&&data.fatal){
          if(is360 && !useNoRef && !tried){ tried=true; try{h.destroy();}catch(err){} start(s,true); return; }
          autoSwitchSource();
        }
      });
      return;
    }
    video.src=s; video.play().catch(function(){});
  }
  if(isM3u8 && state.adFilter && !/^blob:/.test(url)){
    filterM3u8(url, function(s){ start(s); });
  } else {
    if(isM3u8 && !window.Hls){ loadHls(function(){ start(src); }); return; }
    start(src);
  }
}
function loadHls(cb){
  if(window.Hls){ cb(); return; }
  var cnds=[
    "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js",
    "https://unpkg.com/hls.js@1/dist/hls.min.js",
    "https://cdn.staticfile.org/hls.js/1.5.13/hls.min.js",
    "https://cdn.bootcdn.net/ajax/libs/hls.js/1.5.13/hls.min.js"
  ];
  var i=0;
  function next(){
    if(i>=cnds.length){ cb(); return; }
    var s=document.createElement("script"); s.src=cnds[i++];
    s.onload=function(){ cb(); }; s.onerror=next;
    document.head.appendChild(s);
  }
  next();
}

function exportSrc(){
  var data=JSON.stringify(state.sources.map(function(s){return {name:s.name,api:s.api};}));

function importSrcPrompt(){
  var txt=prompt("粘贴鲸鱼影视源列表JSON（或 [{name,api}] 数组）:");

  }catch(e){ toast("格式无法解析"); }
}

  var sb=document.getElementById("sidebar"); if(sb&&sb.classList.contains("open")){ closeSidebar(); return; }

var carouselN=0, carouselTimer=null, carouselIdx=0;
function carouselStart(n){
  carouselN=n; carouselIdx=0;
  if(carouselTimer){ clearInterval(carouselTimer); carouselTimer=null; }
  var tr=document.getElementById("cTrack"); if(!tr||n<2) return;
  carouselTimer=setInterval(function(){ carouselIdx=(carouselIdx+1)%n; carouselGo(carouselIdx); },3800);
}
function carouselGo(i){
  carouselIdx=i; var tr=document.getElementById("cTrack"); var dots=document.getElementById("cDots");
  if(tr) tr.style.transform="translateX(-"+(i*100)+"%)";
  if(dots){ var ds=dots.querySelectorAll(".c-dot"); for(var k=0;k<ds.length;k++) ds[k].classList.toggle("on",k===i); }
}
function carouselStop(){ if(carouselTimer){ clearInterval(carouselTimer); carouselTimer=null; } }

/* ================= 排行榜 ================= */
function renderRank(){
  var box=document.getElementById("rankBox"); if(!box) return;
  var src=state.curSrc;
  Promise.all([
    getJson("ac=videolist&pg=1&pagesize=10&order=desc&by=hits",src).catch(function(){return {list:[]};}),
    getJson("ac=videolist&pg=1&pagesize=10&order=desc&by=time",src).catch(function(){return {list:[]};})
  ]).then(function(rs){
    var hot=(rs[0]&&rs[0].list)||[]; var fresh=(rs[1]&&rs[1].list)||[];
    if(!hot.length&&!fresh.length) return;
    var esc=function(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");};
    function listHtml(arr,mode){
      return arr.map(function(v,i){
        var sub= mode==="hot"? (v.vod_hits?("热度 "+v.vod_hits):(v.type_name||"")) : (v.vod_year||v.type_name||"");
        return '<div class="rank-row" onclick="openDetail('+v.vod_id+')">'+
          '<span class="rank-no'+(i<3?" top":"")+'">'+(i+1)+'</span>'+
          '<div class="rank-ph">'+coverHtml(v)+'</div>'+
          '<div class="rank-info"><div class="rank-name">'+esc(v.vod_name||"")+'</div><div class="rank-sub">'+esc(sub)+'</div></div></div>';
      }).join("");
    }
    box.innerHTML=
      (hot.length?'<div class="d-sec">热播榜</div><div class="rank-list">'+listHtml(hot,"hot")+'</div>':"")+
      (fresh.length?'<div class="d-sec">新片榜</div><div class="rank-list">'+listHtml(fresh,"new")+'</div>':"");
  }).catch(function(){});
}

function renderSideRank(catId){
  var box=document.getElementById("sideRank"); if(!box) return;
  box.innerHTML='<div style="color:var(--sub);font-size:12px;padding:6px 2px">加载中…</div>';
  var src=state.curSrc;

  var t= (tids&&tids.length)?tids[0]:"";
  function q(by){ return t? getJson("ac=videolist&t="+t+"&pg=1&pagesize=3&order=desc&by="+by,src) : getJson("ac=videolist&pg=1&pagesize=3&order=desc&by="+by,src); }
  Promise.all([q("hits").catch(function(){return {list:[]};}), q("time").catch(function(){return {list:[]};})]).then(function(rs){
    var hot=(rs[0]&&rs[0].list)||[]; var fresh=(rs[1]&&rs[1].list)||[];
    var esc=function(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");};

      var sub= v.vod_hits?("热度 "+v.vod_hits):(v.vod_year||v.type_name||"");
      return '<div class="side-rank-row" onclick="closeSidebar();openDetail('+v.vod_id+')">'+

        '<div class="rank-info"><div class="rank-name">'+esc(v.vod_name||"")+'</div><div class="rank-sub">'+esc(sub)+'</div></div></div>';
    }
    box.innerHTML=
      (hot.length?'<div class="side-rank-sec">热播榜</div>'+hot.map(row).join(""):"")+
      (fresh.length?'<div class="side-rank-sec">新片榜</div>'+fresh.map(row).join(""):"")+
      (catId!=="全部"?'<div class="side-rank-tip">当前分类：'+esc(catId)+' · 显示前 3</div>':"");
  }).catch(function(){ box.innerHTML='<div style="color:var(--sub);font-size:12px;padding:6px 2px">排行加载失败</div>'; });
}

var __uf=0,__ufBusy=false;
function refreshAcc(force){
  var a=getAcc(); if(!a) return;
  if(__ufBusy) return;
  if(!force && Date.now()-__uf<2500) return;
  __ufBusy=true;
  yunApi(YUNJU_URL+"user_yhxx.php",{appid:YUNJUN.appid,key:YUNJUN.key,user:a.user}).then(function(r){
    __ufBusy=false; __uf=Date.now();
    if(parseInt(r.code)===1&&r&&typeof r==="object"){ a.info=r; setAcc(a); }
    else { a.info=a.info||{}; setAcc(a); }
    renderMine(); renderAccount();
  }).catch(function(){ __ufBusy=false; __uf=Date.now(); renderMine(); renderAccount(); });
}

  var map={name:["修改昵称","新昵称",YUNJU_URL+"user_name.php"],qq:["修改 QQ","新 QQ 号",YUNJU_URL+"user_qq.php"],email:["修改邮箱","新邮箱",YUNJU_URL+"user_email.php"],qm:["修改签名","新签名",YUNJU_URL+"user_qm.php"],pass:["修改密码","当前密码",YUNJU_URL+"user_pass.php"]};

    '<button class="acc-btn" onclick="submitEdit(\''+k+'\')">保存修改</button></div>';
}
function submitEdit(k){
  var a=getAcc(); if(!a) return;
  var v1=document.getElementById("ef1").value.trim();
  if(!v1) return toast("请输入内容");
  var url,par={appid:YUNJUN.appid,key:YUNJUN.key,user:a.user};
  if(k==="name"){url=YUNJU_URL+"user_name.php";par.name=v1;}
  else if(k==="qq"){url=YUNJU_URL+"user_qq.php";par.QQ=v1;}
  else if(k==="email"){url=YUNJU_URL+"user_email.php";par.email=v1;}
  else if(k==="qm"){url=YUNJU_URL+"user_qm.php";par.autograph=v1;}
  else if(k==="pass"){ var v2=document.getElementById("ef2").value; if(!v2)return toast("请输入新密码"); url=YUNJU_URL+"user_pass.php";par.pass=v1;par.password=v2; }
  toast("保存中…");
  yunApi(url,par).then(function(r){
    var ok=(parseInt(r.code)===1);
    toast(r.msg||(ok?"保存成功":"保存失败"));
    if(ok){
      // 以云端为准：改成功即从云端重新拉取最新信息，并回到我的页
      a.pass=(k==="pass"&&v2)?v2:a.pass;
      setAcc(a);
      refreshAcc(true);
      afterLogin();
    }
  }).catch(function(){ toast("保存失败，请检查网络"); });
}

function getFollow(){ try{ return JSON.parse(localStorage.getItem("jy_follow")||"[]"); }catch(e){ return []; } }
function saveFollow(l){ localStorage.setItem("jy_follow",JSON.stringify(l)); }
function isFollow(id){ return getFollow().some(function(f){return f.id===id;}); }
function toggleFollow(){
  if(!state.vod) return;
  var id=state.vod.vod_id; var fl=getFollow();
  if(fl.some(function(f){return f.id===id;})){ saveFollow(fl.filter(function(f){return f.id!==id;})); toast("已取消追剧"); }
  else{ fl.unshift({id:id,name:state.vod.vod_name||"",pic:state.vod.vod_pic||"",from:state.curSrc,lastEpiN:state.playEpiIdx||0,added:Date.now()}); saveFollow(fl); toast("已追剧，更新会提醒你"); }
  var fb=document.querySelector(".follow-btn");
  if(fb){ var on=isFollow(id); fb.className="follow-btn"+(on?" on":""); fb.innerHTML=(on?"♥ 追剧中":"♡ 追剧"); }
}
function updateFollowEpi(id,i){
  var fl=getFollow();
  for(var k=0;k<fl.length;k++){ if(fl[k].id===id){ fl[k].lastEpiN=i; saveFollow(fl); break; } }
}
function followCard(f,upd){
  var pic=f.pic?'<img referrerpolicy="no-referrer" loading="lazy" src="'+f.pic+'" onerror="this.outerHTML=makeTxtCover(\''+(f.name||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")+'\')">':makeTxtCover(f.name||"影视");
  return '<div class="card" data-fid="'+f.id+'" onclick="openFollow(\''+f.id+'\','+f.from+')">'+
    '<div class="ph">'+pic+'<span class="f-upd" style="display:'+(upd?"block":"none")+'">更新</span></div>'+
    '<div class="tt"><div class="name">'+(f.name||"")+'</div><div class="sub">追剧</div></div></div>';
}
function openFollow(id,from){
  var src= (from>=0&&state.sources[from])?from:state.curSrc;
  openOv("detailOv");
  document.getElementById("detailBody").innerHTML='<div style="padding:90px 0;text-align:center"><div class="spinner"></div><div>加载中…</div></div>';
  function doD(s){
    getJson("ac=detail&ids="+id, s).then(function(d){
      var v=(d&&d.list&&d.list[0])||{}; if(!v.vod_id){ if(s!==state.curSrc){ doD(state.curSrc); return; } toast("影片已失效"); closeDetail(); return; }
      state.vod=v; state.playFromIdx=0; state.playEpiIdx=0;
      var h=getHistory().filter(function(x){return x.id===id;})[0];
      if(h&&h.from!==undefined&&h.epi!==undefined){ state.playFromIdx=h.from; state.playEpiIdx=h.epi; }
      renderDetail();
    }).catch(function(){ if(s!==state.curSrc){ doD(state.curSrc); return; } toast("加载失败"); closeDetail(); });
  }
  doD(src);
}
function renderFollow(){
  var fl=getFollow(); var grid=document.getElementById("grid");
  grid.style.display="";
  var msg=document.getElementById("msg"); if(msg){ msg.style.display="none"; msg.innerHTML=""; }
  if(!fl.length){ showMsg('<div class="msg">还没有追剧<br>去详情页点「♡ 追剧」收藏，有更新会在这里提醒你</div>'); return; }
  grid.innerHTML=fl.map(function(f){ return followCard(f,false); }).join("");
  fl.forEach(function(f){
    var src= (f.from>=0&&state.sources[f.from])?f.from:state.curSrc;
    getJson("ac=detail&ids="+f.id, src).then(function(d){
      var v=(d&&d.list&&d.list[0])||{}; var g=parsePlay(v);
      var total=0; g.forEach(function(gg){ total=Math.max(total,gg.eps.length); });
      var el=document.querySelector('[data-fid="'+f.id+'"] .f-upd');
      if(el&&total>(f.lastEpiN||0)) el.style.display="block";
    }).catch(function(){});
  });
}

/* ================= 猜你喜欢 ================= */
function recommendRelated(v){
  var box=document.getElementById("detailBody"); if(!box) return;
  var tid=v.vod_type_id||v.vod_type||"";
  var src=state.curSrc;
  var req;
  if(tid){ req=getJson("ac=videolist&t="+tid+"&pg="+(1+Math.floor(Math.random()*3))+"&pagesize=8", src); }
  else { req=Promise.resolve({list:[]}); }
  req.then(function(d){
    var l=(d&&d.list)||[];
    var out=l.filter(function(x){ return x.vod_id!==v.vod_id; }).slice(0,8);
    if(!out.length) return;
    var html='<div class="d-sec">猜你喜欢</div><div class="rel-scroll">'+out.map(function(x){
      var pic=x.vod_pic?'<img referrerpolicy="no-referrer" loading="lazy" src="'+x.vod_pic+'" onerror="this.outerHTML=makeTxtCover(\''+(x.vod_name||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")+'\')">':makeTxtCover(x.vod_name||"影视");
      return '<div class="rel-card" onclick="openDetail('+x.vod_id+')"><div class="rel-ph">'+pic+'</div><div class="rel-name">'+(x.vod_name||"")+'</div></div>';
    }).join("")+'</div>';
    var w=document.createElement("div"); w.innerHTML=html;
    var sec=w.firstChild, scroll=w.children[1];
    if(sec) box.appendChild(sec);
    if(scroll) box.appendChild(scroll);
  }).catch(function(){});
}

/* ================= 播放器: 小窗 ================= */
function togglePiP(){
  var v=document.querySelector("#playerBox video");
  if(!v) return;
  try{
    if(document.pictureInPictureElement){ document.exitPictureInPicture(); return; }
    if(v.requestPictureInPicture){ v.requestPictureInPicture().catch(function(){ toast("当前环境不支持小窗"); }); }
    else toast("当前环境不支持小窗");
  }catch(e){ toast("当前环境不支持小窗"); }
}
